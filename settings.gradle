def setJavaHomeFromEnvOrDefault() {
    def envJava = System.getenv('JAVA_HOME')
    if (envJava) {
        if (file(envJava).exists()) {
            println "gradle settings: using JAVA_HOME from environment: ${envJava}"
            System.setProperty('org.gradle.java.home', file(envJava).absolutePath)
            try { gradle.startParameter.setJavaHome(file(envJava)) } catch (Exception e) { /* ignore */ }
            return
        } else {
            println "gradle settings: JAVA_HOME set in environment but path doesn't exist: ${envJava}"
        }
    }

    def os = System.properties['os.name']?.toLowerCase() ?: ''
    if (os.contains('win')) {
        def winPath = 'C:\\Program Files\\Java\\jdk-21'
        if (file(winPath).exists()) {
            println "gradle settings: no valid JAVA_HOME; using Windows fallback: ${winPath}"
            System.setProperty('org.gradle.java.home', file(winPath).absolutePath)
            try { gradle.startParameter.setJavaHome(file(winPath)) } catch (Exception e) { /* ignore */ }
        } else {
            println "gradle settings: Windows fallback not found: ${winPath}"
        }
    } else if (os.contains('mac')) {
        def macPath = '/Library/Java/JavaVirtualMachines/jdk-21.jdk/Contents/Home'
        if (file(macPath).exists()) {
            println "gradle settings: no valid JAVA_HOME; using macOS fallback: ${macPath}"
            System.setProperty('org.gradle.java.home', file(macPath).absolutePath)
            try { gradle.startParameter.setJavaHome(file(macPath)) } catch (Exception e) { /* ignore */ }
        } else {
            println "gradle settings: macOS fallback not found: ${macPath}"
        }
    } else if (os.contains('linux')) {
        // Debian/Ubuntu `openjdk-21-jdk` installs to /usr/lib/jvm/java-21-openjdk-<arch>
        def linuxPath = file('/usr/lib/jvm').listFiles()?.find { it.name.startsWith('java-21-openjdk') }
        if (linuxPath?.exists()) {
            println "gradle settings: no valid JAVA_HOME; using Linux fallback: ${linuxPath}"
            System.setProperty('org.gradle.java.home', linuxPath.absolutePath)
            try { gradle.startParameter.setJavaHome(linuxPath) } catch (Exception e) { /* ignore */ }
        } else {
            println "gradle settings: Linux fallback not found under /usr/lib/jvm (install openjdk-21-jdk)"
        }
    } else {
        println "gradle settings: no JAVA_HOME and unknown OS (${os}); not setting java home."
    }
}

setJavaHomeFromEnvOrDefault()
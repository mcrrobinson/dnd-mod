plugins {
	id 'fabric-loom' version '1.9-SNAPSHOT'
	id 'maven-publish'
}

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {

    mavenCentral()

	flatDir {
        dirs 'libs'
    }
    maven { url "https://maven.jamieswhiteshirt.com/libs-release/"}
	maven {
        url "https://maven.architectury.dev/" // Replace with the actual URL
    }
	maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
                includeGroupByRegex("software\\.bernie.*")
                includeGroup("com.eliotlash.mclib")
        }
	}
}

loom {
    accessWidenerPath = file("src/main/resources/dndclasses.accesswidener")
	runs {
        client {
            client()
            name "Minecraft Client"
            // -PdevRunDir=run-2 runs a second client from its own copy of run/ (worlds can't be shared)
            runDir project.findProperty('devRunDir') ?: 'run'
            // Load straight into the dev world, skipping the title screen (see DevScript; 1.19.4
            // has no --quickPlaySingleplayer). Override with -PdevWorld=<name>, or -PdevWorld= to disable.
            vmArg "-Ddnd.autojoin=${project.findProperty('devWorld') ?: 'New World'}"
            // Scripted testing: ./gradlew runClient -PdevScript=devscripts/<script>.txt (see DevScript)
            // -PdevServer=localhost:25599 joins a server or LAN game instead (e.g. a second test client)
            if (project.hasProperty('devServer')) {
                vmArg "-Ddnd.autoconnect=${project.property('devServer')}"
            }
            if (project.hasProperty('devScript')) {
                vmArg "-Ddnd.devscript=${file(project.property('devScript')).absolutePath}"
            }
            // Scripted runs get a hidden window that never takes focus, so they can run in the
            // background (and several at once). -PdevHidden=false shows it, -PdevHidden forces it.
            def hidden = project.findProperty('devHidden')
            if (hidden == null ? project.hasProperty('devScript') : hidden != 'false') {
                vmArg "-Ddnd.hidden=true"
            }
        }
    }
}

dependencies {
    //to change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modApi "dev.architectury:architectury-fabric:${project.architectury_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modImplementation files("libs/identity-2.7.0-1.19.4-fabric-dev-build-2.jar")

    // PSA: Some older mods, compiled on Loom 0.2.1, might have outdated Maven POMs.
    // You may need to force-disable transitiveness on them.
    modImplementation "com.jamieswhiteshirt:reach-entity-attributes:2.3.2"
    include "com.jamieswhiteshirt:reach-entity-attributes:2.3.2"

    // include "me.sargunvohra.mcmods:autoconfig1u:3.4.0"
    // modApi("me.sargunvohra.mcmods:autoconfig1u:3.4.0") {
    //     exclude(group: "net.fabricmc.fabric-api")
    //     exclude(group: "net.fabricmc", module: "fabric-loader")
    // }
	// CottonMC and Draylar Maven repos are offline; these resolve from the libs/ flatDir
	// (LibGui from its GitHub release, omega-config extracted from the identity jar).
	modImplementation include("io.github.cottonmc:LibGui:7.1.1+1.19.4")
	modImplementation include("dev.draylar.omega-config:omega-config-base:1.3.0+1.19.2")
	// LibGui's own deps (nested in its jar, but the dev runtime doesn't load nested jars)
	modLocalRuntime("io.github.cottonmc:Jankson-Fabric:5.0.1+j1.2.2")
	modLocalRuntime("io.github.juuxel:libninepatch:1.2.0")
	localRuntime("blue.endless:jankson:1.2.2")
	modImplementation("software.bernie.geckolib:geckolib-fabric-1.19.4:4.2")
	implementation("com.eliotlash.mclib:mclib:20")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"

	// Minecraft 1.19.4 runs on Java 17, so compile for 17 even though the toolchain is a newer JDK.
	// `release` also stops the code from using APIs newer than Java 17.
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
    // Builds with JDK 21; the bytecode still targets Java 17 (see options.release above).
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			// add all the jars that should be included when publishing to maven
			artifact(remapJar) {
				builtBy remapJar
			}
			artifact(sourcesJar) {
				builtBy remapSourcesJar
			}
		}
	}

	// Select the repositories you want to publish to
	// To publish to maven local, no extra repositories are necessary. Just use the task `publishToMavenLocal`.
	repositories {
		// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	}
}

// The Player Classes table in README.md is generated from the class data the game reads
// (class guidebook, class-pick message), so the two can't drift apart. Edit class_info.json,
// then run ./gradlew generateClassReadme. `check` (and so `build`) fails if the README is stale.
def classInfoFile = file('src/main/resources/data/dndclasses/class_info.json')
def classTableStart = '<!-- class-table:start'
def classTableEnd = '<!-- class-table:end -->'

def readmeWithClassTable = {
	def readme = file('README.md').getText('UTF-8')
	def classes = new groovy.json.JsonSlurper().parse(classInfoFile, 'UTF-8').classes
	// One point per line in each cell; a stray " (done)" status marker never reaches the README
	def cell = { List points -> points.collect { it.replace(' (done)', '').replace('(done)', '').trim() }.join('<br>') }
	def roleName = { String role -> role ? role.toLowerCase().capitalize() : '' }
	def rows = ['| Class | Role | Strengths | Weaknesses | Special ability |', '|-|-|-|-|-|']
	classes.each { c ->
		def page = "docs/classes/${c.name.toLowerCase().replace(' ', '-')}.md"
		def role = "**${roleName(c.role)}**<br>${roleName(c.secondaryRole)}"
		rows << "| **[${c.name}](${page})** | ${role} | ${cell(c.pros)} | ${cell(c.cons)} | ${cell(c.special)} |".toString()
	}
	def startAt = readme.indexOf(classTableStart)
	def endAt = readme.indexOf(classTableEnd)
	if (startAt < 0 || endAt < startAt) {
		throw new GradleException("README.md is missing the ${classTableStart} ... ${classTableEnd} markers")
	}
	def afterStart = readme.indexOf('\n', startAt) + 1
	return readme.substring(0, afterStart) + rows.join('\n') + '\n' + readme.substring(endAt)
}

tasks.register('generateClassReadme') {
	group = 'documentation'
	description = 'Regenerates the Player Classes table in README.md from class_info.json.'
	inputs.file(classInfoFile)
	doLast {
		file('README.md').setText(readmeWithClassTable(), 'UTF-8')
	}
}

tasks.register('checkClassReadme') {
	group = 'verification'
	description = 'Fails if the README class table is out of date with class_info.json.'
	inputs.files(classInfoFile, file('README.md'))
	doLast {
		if (file('README.md').getText('UTF-8') != readmeWithClassTable()) {
			throw new GradleException('README.md class table is out of date with src/main/resources/data/dndclasses/class_info.json. '
					+ 'Edit the JSON (not the README table), then run ./gradlew generateClassReadme')
		}
	}
}

tasks.named('check') { dependsOn 'checkClassReadme' }

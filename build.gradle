plugins {
	id 'fabric-loom' version '1.9-SNAPSHOT'
	id 'maven-publish'
}

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {

    mavenCentral()

	flatDir {
        dirs 'libs'
    }
    maven { url "https://maven.jamieswhiteshirt.com/libs-release/"}
	maven {
        url "https://maven.architectury.dev/" // Replace with the actual URL
    }
	maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
                includeGroupByRegex("software\\.bernie.*")
                includeGroup("com.eliotlash.mclib")
        }
	}
}

loom {
    accessWidenerPath = file("src/main/resources/dndclasses.accesswidener")
	runs {
        client {
            client()
            name "Minecraft Client"
            // -PdevRunDir=run-2 runs a second client from its own copy of run/ (worlds can't be shared)
            runDir project.findProperty('devRunDir') ?: 'run'
            // Load straight into the dev world, skipping the title screen (see DevScript; 1.19.4
            // has no --quickPlaySingleplayer). Override with -PdevWorld=<name>, or -PdevWorld= to disable.
            vmArg "-Ddnd.autojoin=${project.findProperty('devWorld') ?: 'New World'}"
            // Scripted testing: ./gradlew runClient -PdevScript=devscripts/<script>.txt (see DevScript)
            // -PdevServer=localhost:25599 joins a server or LAN game instead (e.g. a second test client)
            if (project.hasProperty('devServer')) {
                vmArg "-Ddnd.autoconnect=${project.property('devServer')}"
            }
            if (project.hasProperty('devScript')) {
                vmArg "-Ddnd.devscript=${file(project.property('devScript')).absolutePath}"
            }
            // Scripted runs get a hidden window that never takes focus, so they can run in the
            // background (and several at once). -PdevHidden=false shows it, -PdevHidden forces it.
            def hidden = project.findProperty('devHidden')
            if (hidden == null ? project.hasProperty('devScript') : hidden != 'false') {
                vmArg "-Ddnd.hidden=true"
            }
        }
    }
}

dependencies {
    //to change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modApi "dev.architectury:architectury-fabric:${project.architectury_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modImplementation files("libs/identity-2.7.0-1.19.4-fabric-dev-build-2.jar")

    // PSA: Some older mods, compiled on Loom 0.2.1, might have outdated Maven POMs.
    // You may need to force-disable transitiveness on them.
    modImplementation "com.jamieswhiteshirt:reach-entity-attributes:2.3.2"
    include "com.jamieswhiteshirt:reach-entity-attributes:2.3.2"

    // include "me.sargunvohra.mcmods:autoconfig1u:3.4.0"
    // modApi("me.sargunvohra.mcmods:autoconfig1u:3.4.0") {
    //     exclude(group: "net.fabricmc.fabric-api")
    //     exclude(group: "net.fabricmc", module: "fabric-loader")
    // }
	// CottonMC and Draylar Maven repos are offline; these resolve from the libs/ flatDir
	// (LibGui from its GitHub release, omega-config extracted from the identity jar).
	modImplementation include("io.github.cottonmc:LibGui:7.1.1+1.19.4")
	modImplementation include("dev.draylar.omega-config:omega-config-base:1.3.0+1.19.2")
	// LibGui's own deps (nested in its jar, but the dev runtime doesn't load nested jars)
	modLocalRuntime("io.github.cottonmc:Jankson-Fabric:5.0.1+j1.2.2")
	modLocalRuntime("io.github.juuxel:libninepatch:1.2.0")
	localRuntime("blue.endless:jankson:1.2.2")
	modImplementation("software.bernie.geckolib:geckolib-fabric-1.19.4:4.2")
	implementation("com.eliotlash.mclib:mclib:20")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"

	// The Minecraft launcher currently installs Java 8 for users, so your mod probably wants to target Java 8 too
	// JDK 9 introduced a new way of specifying this that will make sure no newer classes or methods are used.
	// We'll use that if it's available, but otherwise we'll use the older option.
    def targetVersion = 21
	if (JavaVersion.current().isJava9Compatible()) {
		 it.options.release = targetVersion
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			// add all the jars that should be included when publishing to maven
			artifact(remapJar) {
				builtBy remapJar
			}
			artifact(sourcesJar) {
				builtBy remapSourcesJar
			}
		}
	}

	// Select the repositories you want to publish to
	// To publish to maven local, no extra repositories are necessary. Just use the task `publishToMavenLocal`.
	repositories {
		// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	}
}
